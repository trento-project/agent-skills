name: Validate skills
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check script self-test
        run: tests/run.sh
      - name: Check skills
        run: scripts/check-skills.sh skills --neutral
      - name: Check prose files
        run: "! grep -nEf scripts/forbidden-patterns.txt README.md PRACTICES.md AGENTS.md templates/*.md"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: agentskills reference validator
        run: |
          pip install "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          for s in skills/*/; do skills-ref validate "$s"; done
